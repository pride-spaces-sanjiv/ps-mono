services:
  mongodb:
    image: mongo:latest
    container_name: pridespaces-mongo
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - ./mongodb-data:/data/db
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:management
    container_name: pridespaces-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBIT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBIT_PASS}
    ports:
      - "${RABBIT_PORT}:5672" # AMQP protocol port
      - "${RABBIT_UI_PORT}:15672" # Management UI port
    volumes:
      - ./rabbitmq-data:/var/lib/rabbitmq
    restart: always

  redis:
    image: redis:latest
    container_name: pridespaces-redis
    ports:
      - "${REDIS_PORT}:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASS}"]
    volumes:
      - ./redis-data:/data
    restart: always

volumes:
  mongodb-data:
    driver: local
  rabbitmq-data:
    driver: local
  redis-data:
    driver: local
